
input {
  beats {
    port => 5044
  }
}

filter {
  if [agent][type] == 'winlogbeat' {
    mutate {
      add_field => { 'source_pipeline' => 'winlogbeat' }
    }
  }

    # Event ID 7045  New service installed (System log, not Sysmon)
  if [winlog][channel] == "System" and [winlog][event_id] == "7045" {
    mutate {
      add_field => {
        "[event][category]" => "service"
        "[event][action]" => "service_installed"
      }
      rename => {
        "[winlog][event_data][ServiceName]" => "[service][name]"
        "[winlog][event_data][ImagePath]" => "[process][name]"
      }
    }
  }

    # PowerShell 4104 
  if [winlog][channel] == "Microsoft-Windows-PowerShell/Operational" and [winlog][event_id] == "4104" {
    mutate {
      add_field => {
        "[event][category]" => "process"
        "[event][action]" => "powershell_script_block"
      }
      rename => {
        "[winlog][event_data][ScriptBlockText]" => "[process][command_line]"
      }
    }
  }

  # Security 1102
  if [winlog][channel] == "Security" and [winlog][event_id] == "1102" {
    mutate { 
      add_field => { 
        "[event][category]" => "log_clear" 
        "[event][action]" => "security_log_cleared" 
      } 
    }
  }

  # System 104 
  if [winlog][channel] == "System" and [winlog][event_id] == "104" {
    mutate { 
      add_field => { "[event][category]" => "event_log_cleared" 
      } 
    }
  }


  
  if [winlog][channel] == "Microsoft-Windows-Sysmon/Operational" {

    if [winlog][event_id] == "1" {
      mutate {
        add_field => {
          "[event][category]" => "process"
          "[event][action]" => "start"
        }
        rename => {
          "[winlog][event_data][CommandLine]" => "[process][command_line]"
          "[winlog][event_data][Image]" => "[process][executable]"
          "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
          "[winlog][event_data][ProcessId]" => "[process][pid]"
          "[winlog][event_data][ParentCommandLine]" => "[process][parent][command_line]"
          "[winlog][event_data][ParentImage]" => "[process][parent][executable]"
          "[winlog][event_data][ParentProcessGuid]" => "[process][parent][entity_id]"
          "[winlog][event_data][ParentProcessId]" => "[process][parent][pid]"
          "[winlog][event_data][User]" => "[user][name]"
        }
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<[process][name]>[^\\\\]+)$" }
      }
      grok {
        match => { "[process][parent][executable]" => "(?:.*\\\\)?(?<[process][parent][name]>[^\\\\]+)$" }
      }
    }
        # Event ID 3 network connection
    if [winlog][event_id] == "3" {
      mutate {
        add_field => {
          "[event][category]" => "network"
          "[event][action]" => "connection_attempted"
        }
        rename => {
          "[winlog][event_data][Image]" => "[process][executable]"
          "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
          "[winlog][event_data][ProcessId]" => "[process][pid]"
          "[winlog][event_data][SourceIp]" => "[source][ip]"
          "[winlog][event_data][SourcePort]" => "[source][port]"
          "[winlog][event_data][DestinationIp]" => "[destination][ip]"
          "[winlog][event_data][DestinationPort]" => "[destination][port]"
          "[winlog][event_data][DestinationHostname]" => "[destination][domain]"
          "[winlog][event_data][Protocol]" => "[network][transport]"
        }
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<proc_name_tmp>[^\\\\]+)$" }
      }
      mutate {
        rename => { "proc_name_tmp" => "[process][name]" }
      }
    }

    # Event ID 7 image/DLL load
    if [winlog][event_id] == "7" {
      mutate {
        add_field => {
          "[event][category]" => "process"
          "[event][action]" => "image_loaded"
        }
        rename => {
          "[winlog][event_data][Image]" => "[process][executable]"
          "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
          "[winlog][event_data][ProcessId]" => "[process][pid]"
          "[winlog][event_data][ImageLoaded]" => "[file][path]"
          "[winlog][event_data][Signed]" => "[file][code_signature][signed]"
        }
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<proc_name_tmp>[^\\\\]+)$" }
      }
      grok {
        match => { "[file][path]" => "(?:.*\\\\)?(?<file_name_tmp>[^\\\\]+)$" }
      }
      mutate {
        rename => {
          "proc_name_tmp" => "[process][name]"
          "file_name_tmp" => "[file][name]"
        }
      }
    }

    # Event ID 8 CreateRemoteThread
    if [winlog][event_id] == "8" {
      mutate {
        add_field => {
          "[event][category]" => "process"
          "[event][action]" => "create_remote_thread"
        }
        rename => {
          "[winlog][event_data][SourceImage]" => "[process][executable]"
          "[winlog][event_data][SourceProcessGuid]" => "[process][entity_id]"
          "[winlog][event_data][SourceProcessId]" => "[process][pid]"
          "[winlog][event_data][TargetImage]" => "[process][target][executable]"
          "[winlog][event_data][TargetProcessGuid]" => "[process][target][entity_id]"
          "[winlog][event_data][TargetProcessId]" => "[process][target][pid]"
          "[winlog][event_data][StartAddress]" => "[process][thread][start_address]"
          "[winlog][event_data][StartModule]" => "[process][thread][start_module]"
          "[winlog][event_data][StartFunction]" => "[process][thread][start_function]"
        }
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<proc_name_tmp>[^\\\\]+)$" }
      }
      grok {
        match => { "[process][target][executable]" => "(?:.*\\\\)?(?<target_name_tmp>[^\\\\]+)$" }
      }
      mutate {
        rename => {
          "proc_name_tmp" => "[process][name]"
          "target_name_tmp" => "[process][target][name]"
        }
      }
    }

    # Event ID 15 fileCreatestreamHash
    if [winlog][event_id] == "15" {
      mutate {
        add_field => {
          "[event][category]" => "file"
          "[event][action]" => "alternate_data_stream_created"
        }
        rename => {
          "[winlog][event_data][Image]" => "[process][executable]"
          "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
          "[winlog][event_data][ProcessId]" => "[process][pid]"
          "[winlog][event_data][TargetFilename]" => "[file][path]"
          "[winlog][event_data][Hash]" => "[file][hash][value]"
        }
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<proc_name_tmp>[^\\\\]+)$" }
      }
      grok {
        match => { "[file][path]" => "(?:.*\\\\)?(?<file_name_tmp>[^\\\\]+)$" }
      }
      mutate {
        rename => {
          "proc_name_tmp" => "[process][name]"
          "file_name_tmp" => "[file][name]"
        }
      }
    }

    # Event ID 19 WMI filter registered
    if [winlog][event_id] == "19" {
      mutate {
        add_field => {
          "[event][category]" => "wmi"
          "[event][action]" => "wmi_filter_registered"
        }
        rename => {
          "[winlog][event_data][User]" => "[user][name]"
          "[winlog][event_data][EventNamespace]" => "[wmi][event_namespace]"
          "[winlog][event_data][Name]" => "[wmi][filter][name]"
          "[winlog][event_data][Query]" => "[wmi][query]"
        }
      }
    }

    # Event ID 20  WMI consumer registered
    if [winlog][event_id] == "20" {
      mutate {
        add_field => {
          "[event][category]" => "wmi"
          "[event][action]" => "wmi_consumer_registered"
        }
        rename => {
          "[winlog][event_data][User]" => "[user][name]"
          "[winlog][event_data][Name]" => "[wmi][consumer][name]"
          "[winlog][event_data][Type]" => "[wmi][consumer][type]"
          "[winlog][event_data][Destination]" => "[wmi][consumer][destination]"
        }
      }
    }

    # Event ID 21 WMI consumer-to-filter binding
    if [winlog][event_id] == "21" {
      mutate {
        add_field => {
          "[event][category]" => "wmi"
          "[event][action]" => "wmi_binding_registered"
        }
        rename => {
          "[winlog][event_data][Consumer]" => "[wmi][consumer][name]"
          "[winlog][event_data][Filter]" => "[wmi][filter][name]"
        }
      }
    }  
    # Event ID 13 registry value set
    if [winlog][event_id] == "13" {
      mutate {
       add_field => {
         "[event][category]" => "registry"
         "[event][action]" => "value_set"
       }
       rename => {
         "[winlog][event_data][TargetObject]" => "[registry][path]"
         "[winlog][event_data][Details]" => "[registry][data][strings]"
         "[winlog][event_data][Image]" => "[process][executable]"
         "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
         "[winlog][event_data][ProcessId]" => "[process][pid]"
       } 
      }
      grok {
        match => { "[process][executable]" => "(?:.*\\\\)?(?<proc_name_tmp>[^\\\\]+)$" }
      }  
      mutate {
        rename => { "proc_name_tmp" => "[process][name]" }
      } 
    }   
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "winlogbeat-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "<ELASTIC_PASSWORD>"
    ssl => true
    ssl_certificate_verification => false 
 }
}

